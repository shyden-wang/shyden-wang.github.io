  - title: 项目经历 # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: "W4 Pro翻译耳机"
        caption: 2023年8月 - 2025年3月
        # sub_title: BSc Computer Science
        quote: >
          项目负责人，从0到1，主导了从需求分析、方案设计、开发实现到量产交付的全过程，成功实现了基于杰理7016平台的翻译耳机产品的量产交付。
        description: | # this will include new lines to allow paragraphs
          - 负责项目的整体规划和管理，协调跨部门团队（包括产品、APP、硬件、算法、生产）高效协作，确保项目按时交付。
          - 基于杰理7016平台，实现了基本tws耳机功能，包括LED、 触摸、 提示音等UI配置，智能仓充电， ota，ENC, 入耳检测，BT配置等 。
          - 基于pipline搭建音频流，实现了音视频翻译、电话翻译、同传翻译功能。
          - 基于ble协议，实现了和app的稳定通信，bt传输音频的同时，ble传输多路opus压缩后的翻译音频。
          - 协助实现算法的移植、死机问题排查、线程资源优化、双核资源分配。
          - 开发了充电舱配套方案，区别于普通充电舱的分果果方案，深度开发了充电、关机、开机流程。
          - 开发了产测方案，包括串口方式传输各类测试指令，ble传输音频到兆华设备，3mic校准，生产烧录的导入，蓝牙认证等。
          - 基于AES加密，通过写入认证码的方式，开发了算法认证加密方案，保护了算法的安全性。
          - 其它，包括功耗优化、性能优化（Android、iOS连接速度、通信稳定性、算法异步处理等），场景切换中的断连问题、死机问题，实现了稳定的翻译功能。
      - layout: left
        title: "W4 翻译耳机"
        caption: 2025年3月 - 2025年11月
        # sub_title: BSc Computer Science
        quote: >
          项目负责人，W4 Pro耳机的升级迭代。
        description: | # this will include new lines to allow paragraphs
          - 添加骨导芯片，实现iis 、 tdm驱动开发，打通骨导音频流，确保骨导音频正确传输给算法。
          - 由于iis时钟和pdm时钟的误差， 开发了对齐算法，确保二者音频差值在8ms内。
          - 开发pdm驱动，原厂驱动输出声音小， 深入驱动内部调节pdm增益。
          - 开发通过串口方式，实现4路（16khz)音频导出，配合算法开发调试。
          - SDK从v1升级到v3, 遇到重大内核问题，协助原厂排查，升级SDK。
          - ble连接概率断联问题，排查到天线问题和SDK问题。
          - 接入双路opus算法，开发了双路opus的传输方案，降低带宽压力，提升翻译稳定性。
          - 开发压测用例，通过工具实现自动化压测，解决低概率断联问题， 实现连续压测60小时无断联。
      - layout: left
        title: "X1 Pro翻译耳机"
        caption: 2025年11月 - 2026年5月
        # sub_title: BSc Computer Science
        quote: >
          项目负责人，W4耳机裁剪方案， 单ble功能。
        description: | # this will include new lines to allow paragraphs
          - 裁剪BT模块，去掉BT可发现、可连接功能， 保留tws连接用于双bank升级。
          - 保留ble翻译模块， 适配翻译主机，优化ble连接速度， 功耗续航。
          - 开发通信协议，实现串口通信，开盖即连接ble，入舱判断tws是否组队，组队后才进入ota流程。
          - 开发新的充电方案，去掉智能仓功能， 适配普通充电仓，同时具有串口通信功能。
          - 开发新的骨导芯片方案，调试tdm驱动，打通音频流，测试稳定性导入到算法端。
          - 开发新的产测方案，mic测试、spk测试、骨导测试。
          - 开发ble dtm认证方案，通过小牛与CWM500连接射频测试，遇到接收丢包（PER)概率失败问题，定位到芯片问题。
