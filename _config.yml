# About Section
about_title: 关于我
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  - 10年+嵌入式软件开发经验，专注于蓝牙音频与物联网方案开发。
  - 精通杰理7016系列蓝牙平台深度开发，在翻译耳机领域积累了丰富的量产经验。
  - 具备从需求分析到量产交付的全流程项目经验，累计主导/参与超过5款 tws 翻译耳机量产，20+ USB、音频、2.4g消费类电子产品的量产落地。
  - 善于将复杂需求转化为稳定可靠的产品方案，擅长跨团队（产品、APP、硬件、算法、生产）协作与解决开发、量产过程中的技术难题。
content:
  - title: 专业技能 # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: "语言"  
        description: | # this will include new lines to allow paragraphs
          - 精通 C 语言，熟练掌握嵌入式系统的开发、生产流程。
          - 熟悉汇编语言、C++、Python 等，能完成简单的开发、维护和调试。
      - layout: left
        title: "芯片及架构"
        description: | # this will include new lines to allow paragraphs
          熟练使用常见芯片架构的开发，包括：ARM M0、M3、M4, RISC-V 等，使用的芯片包括新唐、ST（国产芯片）、Telink、Nordic、瑞昱等。
      - layout: left
        title: "知识栈"
        description: |
          - 熟悉经典蓝牙及 BLE 协议，能够基于平台做深入的应用开发、协议开发及 2.4G 开发。
          - 熟悉基于 USB Audio 的开发，能够独立从 0 开始实现 USB + Codec 的音频方案。
          - 熟练使用芯片各个外设，各种常见总线协议，包括但不限于：UART、USB、I2C、SPI、I2S 等。
          - 熟悉 UCOS、RT-Thread 等操作系统，了解其调度切换原理（目前正在学习代码实现过程），能够实现基于应用的开发。
          - 熟悉 Bootloader 的实现过程，能够独立完成基于 USB 的上位机到 MCU 的升级过程，能够用 C++ 实现基本的上位机需求改动及问题调试。

      - layout: left
        title: "个人能力"
        description: |
          - 能够基于中/英文技术文档，独立的对外设进行开发及调试。
          - 具有一定的硬件设计能力，能够设计原理图，常见芯片的焊接，PCB 调试，基本硬件问题的查找及修改。
          - 具有复杂多芯片方案经验，能够主导项目流程，包括软件架构设计，带领团队（包括测试、iOS、Android 开发、固件开发）实现项目量产。
          - 具有快速定位问题、分析问题、解决问题的能力。
          - 具有持续的学习能力，包括使用 ChatGPT、GitHub 等辅助工具。
          - 能够实现一般的算法及调试。
          - 熟练使用 Git 项目管理，VSCode、Eclipse、Keil、Altium Designer 等专业软件。
          - 有个人独立的代码库（多年经验总结、亲自调试的通用模块）。
          - 具备一定的代码分层能力，实现低耦合的模块接口。

