      ● 语言：
      精通c语言，熟练掌握嵌入式系统的开发、生产流程。
      熟悉汇编语言、c++、Python等，能完成简单的开发、维护和调试。
      ● 芯片及架构：
      熟练使用常见芯片架构的开发，包括：ARM  M0、M3、M4, RISCV  等，使用的芯片包括  新唐、ST(国产芯片)、telink、nordic、瑞昱等。
      ● 知识栈：
      熟悉经典蓝牙及ble协议，能够基于平台做深入的应用开发、协议开发及2.4g开发。
      熟悉基于USB audio的开发，能够独立从0开始实现USB+codec的音频方案。
      熟练使用芯片各个外设，各种常见总线协议，包括不限于：UART、USB、I2C、SPI、i2s 等。
      熟悉UCOS、rt_thread等操作系统，了解其调度切换原理，（目前正在学习代码实现过程），能够实现基于应用的开发。
      熟悉bootloader的实现过程，能够独立完成基于USB的上位机到mcu 的升级过程，能够用c++实现基本的上位机需求改动及问题调试。
      ● 个人能力：
      能够基于中/英文技术文档，独立的对外设进行开发及调试。
      具有一定的硬件设计能力，能够设计原理图，常见芯片的焊接，PCB调试，基本硬件问题的查找及修改。
      具有复杂多芯片方案经验，能够主导项目流程，包括软件架构设计，带领团队（包括测试、iOS、android开发、固件开发）实现项目量产。
      具有快速定位问题、分析问题、解决问题的能力。
      具有持续的学习能力，包括chatgpt、github等辅助工具。
      能够实现一般的算法及调试。
      熟练使用git项目管理，vscode、eclipse、keil、Autium Design等专业软件。
      有个人独立的代码库（多年经验总结、亲自调试的通用模块）。
      具备一定的代码分层能力，实现低耦合的模块接口。

