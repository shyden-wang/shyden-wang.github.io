about_title: 关于我
about_profile_image: images/sd.jpg
about_content: | # this will include new lines to allow paragraphs
  10年+嵌入式软件开发经验，专注于蓝牙音频与物联网方案开发。

  精通杰理7016系列蓝牙平台深度开发，在翻译耳机领域积累了丰富的量产经验。

  具备从需求分析到量产交付的全流程项目经验，累计主导/参与超过5款 tws 翻译耳机量产，20+ USB、音频、2.4g消费类电子产品的量产落地。

  善于将复杂需求转化为稳定可靠的产品方案，擅长跨团队（产品、APP、硬件、算法、生产）协作与解决开发、量产过程中的技术难题。


